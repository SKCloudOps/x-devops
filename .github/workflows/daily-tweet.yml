name: Daily DevOps Tweet

on:
  schedule:
    # 7:00 AM CDT -- early birds
    - cron: '0 12 * * *'
    # 9:30 AM CDT -- mid-morning
    - cron: '30 14 * * *'
    # 12:00 PM CDT -- lunch break
    - cron: '0 17 * * *'
    # 2:30 PM CDT -- afternoon
    - cron: '30 19 * * *'
    # 5:00 PM CDT -- end of work
    - cron: '0 22 * * *'
    # 8:00 PM CDT -- evening scroll
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (generate but do not post)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  post-tweet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and post tweet
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python post_daily_tweet.py

      - name: Commit tweet history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tweet_history.json
          git diff --cached --quiet || git commit -m " Daily tweet $(date -u +%Y-%m-%d)"
          git push
