name: Daily Repository Validation Report

on:
  schedule:
    # Runs at 9 AM UTC every day (adjust the time as needed)
    # Format: minute hour day month day-of-week
    - cron: '0 9 * * *'
  # Allow manual triggering
  workflow_dispatch:

jobs:
  validate-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for commit analysis

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest changes
        run: git fetch origin

      - name: Run validation and send report
        env:
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT_EMAIL: ${{ secrets.GMAIL_RECIPIENT_EMAIL }}
        run: python3 send_gmail_report.py

      - name: Upload report logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-logs
          path: report_data_*.json
          retention-days: 7
