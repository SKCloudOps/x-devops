name: Daily Repository Validation Report

on:
  schedule:
    # Runs at 9 AM UTC every day (adjust the time as needed)
    # Format: minute hour day month day-of-week
    - cron: '0 9 * * *'
  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for commit analysis

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Fetch latest changes
        run: git fetch origin

      - name: Run repository validation
        id: validate
        env:
          REPO_PATH: ${{ github.workspace }}
        run: |
          REPORT_FILE=$(bash scripts/validate_and_report.sh)
          echo "report_file=$REPORT_FILE" >> $GITHUB_OUTPUT
          cat "$REPORT_FILE"

      - name: Generate email report payload
        id: email
        env:
          REPO_PATH: ${{ github.workspace }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL || 'sathishkr.cs@gmail.com' }}
        run: |
          python3 scripts/send_daily_report.py --email "$REPORT_EMAIL" > /tmp/email_payload.json
          cat /tmp/email_payload.json

      - name: Create GitHub workflow summary
        run: |
          echo "## 📊 Daily Repository Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Generated:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Repository Status" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat ${{ steps.validate.outputs.report_file }} >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: daily-validation-report
          path: ${{ steps.validate.outputs.report_file }}
          retention-days: 30
